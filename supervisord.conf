[supervisord]
nodaemon=true
user=root

[program:amnutsTalker]
command=/amnuts/build/amnutsTalker
directory=/amnuts
autostart=true
autorestart=unexpected
; Treat clean exit (0) and deliberate boot_exit failure (1) as expected.
; The migration gate, malformed-config errors, and shutdown command all
; exit 1 on purpose -- supervisord must not restart in those cases or it
; will spin in a respawn loop. Real crashes (SIGSEGV etc.) come back as
; 128+signum and stay "unexpected", so genuine failures still trigger
; a restart.
exitcodes=0,1
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=IN_FOREGROUND="1"
startsecs=0
