# Amnuts — French translation (demonstration locale for Phase 6).
#
# Partial: only a handful of keys are translated. Everything else
# falls back to en_GB at lookup time via the Phase 2 catalog
# fallback mechanism. New translators can clone this file and grow
# it organically — there's no requirement to cover every key
# before a locale is usable.
#
# Format rules (mirroring en_GB/strings.yml):
# - Keys are dot-namespaced; values are printf format strings using
#   POSIX positional specifiers (%1$s, %2$d).
# - Preserve %N$X positions and types EXACTLY as en_GB declares them.
# - ~XX colour escapes pass through opaque; you may add or drop them
#   but the catalog validator only checks printf signatures, not
#   colour balance. Mismatched ~RS could leave terminals stuck on a
#   colour for the next line.
# - Run `python tools/locale/check.py files/langs/fr/strings.yml`
#   before committing.

meta.name:        "Français"
meta.description: "Traduction française (partielle ; les clés non traduites se rabattent sur l'anglais)."

# Smoke-test key from Phase 2.
ping.greeting:    "Bonjour, %1$s. Le catalogue fonctionne.\n"

# cafk — vider le tampon de relecture AFK.
cafk.cleared:                     "Votre tampon de relecture AFK a été vidé.\n"

# home — retour à son système d'origine (NETLINKS).
home.already_home:                "Vous êtes déjà sur votre système d'origine.\n"
home.traverse:                    "~FB~OLVous traversez le cyberespace...\n"

# muzzle / unmuzzle — commandes d'administration.
muzzle.usage:                     "Utilisation : muzzle <utilisateur>\n"
muzzle.self:                      "Essayer de se museler soi-même est le neuvième signe de folie.\n"
muzzle.higher_level:              "Vous ne pouvez pas museler un utilisateur de niveau égal ou supérieur au vôtre.\n"
muzzle.already:                   "%1$s~RS est déjà muselé.\n"
muzzle.applied:                   "~FR~OL%1$s a maintenant une muselière de niveau : ~RS~OL%2$s.\n"

unmuzzle.usage:                   "Utilisation : unmuzzle <utilisateur>\n"
unmuzzle.self:                    "Essayer de se démuseler soi-même est le dixième signe de folie.\n"
unmuzzle.not_muzzled:             "%1$s~RS n'est pas muselé.\n"
unmuzzle.applied:                 "~FG~OLVous retirez la muselière de %1$s~RS.\n"

# revafk — afficher le tampon de relecture AFK.
revafk.header:                    "\n~BB~FG*** Votre tampon de relecture AFK ***\n\n"
revafk.empty:                     "Le tampon AFK est vide.\n"
revafk.footer:                    "\n~BB~FG*** Fin ***\n\n"

# revclr — vider le tampon de relecture de la pièce.
revclr.room_notice:               "%1$s~RS vide le tampon de relecture.\n"
revclr.self:                      "Vous videz le tampon de relecture.\n"

# suicide — supprimer son compte.
suicide.usage:                    "Utilisation : suicide <votre mot de passe>\n"
suicide.password_incorrect:       "Mot de passe incorrect.\n"
suicide.confirm_prompt:           "\n\a~FR~OL~LI*** ATTENTION — Cela supprimera votre compte ! ***\n\nÊtes-vous sûr ? (y|n) "

# wake — réveiller un utilisateur AFK.
wake.muzzled:                     "Vous êtes muselé, vous ne pouvez réveiller personne.\n"
wake.usage:                       "Utilisation : wake <utilisateur>\n"
wake.self:                        "Essayer de se réveiller soi-même est le huitième signe de folie.\n"
wake.target_afk:                  "Vous ne pouvez pas réveiller quelqu'un qui est AFK.\n"
wake.target_editor:               "Vous ne pouvez pas réveiller quelqu'un qui est dans l'éditeur.\n"
wake.target_ignall:               "Vous ne pouvez pas réveiller quelqu'un qui ignore tout.\n"
wake.sent:                        "Appel de réveil envoyé.\n"
